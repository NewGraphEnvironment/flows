# Build a package's pkgdown site, refuse undeclared root pages, and deploy it to gh-pages.
#
# Called from a package's .github/workflows/pkgdown.yaml:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#     release:
#       types: [published]
#     workflow_dispatch:
#   name: pkgdown.yaml
#   permissions: read-all
#   jobs:
#     pkgdown:
#       permissions:
#         contents: write
#       uses: NewGraphEnvironment/flows/.github/workflows/r-pkgdown.yaml@v1
#
# The job inherits the caller job's token permissions, so the caller grants
# `contents: write` for the deploy. A package with steps the inputs cannot express keeps its
# own workflow and says why in a comment.
# Derived from https://github.com/r-lib/actions/tree/v2/examples

name: r-pkgdown

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner image. Named rather than ubuntu-latest, so an image change is one edit here.
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: A stalled apt mirror or a package compiling from source otherwise holds the job for 6 h.
        type: number
        default: 90
      allowed-pages:
        description: Root pages the site may publish, space separated, without extension. An entry is a decision that the page is public.
        type: string
        default: 404 authors index LICENSE LICENSE-text
      deploy:
        description: Deploy to gh-pages on a non-pull-request event. False builds and checks only.
        type: boolean
        default: true
      extra-packages:
        description: Packages to install beyond the package's dependencies, comma or space separated.
        type: string
        default: ''

jobs:
  pkgdown:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.repository }}-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # pkgdown renders EVERY root-level .md except a hardcoded allowlist (README,
      # LICENSE, NEWS and two GitHub templates), and there is no config option to
      # exclude one. `.Rbuildignore` does not help: it governs `R CMD build`, not the
      # docs site. Removing the file before the build is the only thing that stops all
      # three copies being produced: the rendered page, a verbatim copy of the source,
      # and the full-text search index.
      - name: Keep internal notes out of the published site
        run: rm -f CLAUDE.md

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::., ${{ inputs.extra-packages }}
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # The step above stops one file being built. This stops the NEXT one being built
      # without anyone noticing: a root-level .md added a year from now would otherwise
      # publish silently.
      - name: Fail if an unexpected page reached the site
        env:
          ALLOWED: ${{ inputs.allowed-pages }}
        run: |
          set -eu
          allowed="$ALLOWED"

          # An empty result set is not a pass. A loop over nothing exits 0, so a build
          # that produced no pages at all would report "all declared".
          [ -f docs/index.html ] || { echo "docs/index.html missing: the build produced no site"; exit 1; }

          # Exact token match. `case " $allowed " in *" $b "*)` matches a contiguous
          # substring of the list, so a page named "authors index" would pass.
          is_allowed() {
            for a in $allowed; do
              if [ "$a" = "$1" ]; then return 0; fi
            done
            return 1
          }

          # Both extensions: pkgdown writes a rendered .html AND a markdown twin for every
          # root page. Strip the suffix that matched; stripping both reduces
          # "index.md.html" to "index".
          unexpected=""
          for f in docs/*.html docs/*.md; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            case "$f" in
              *.html) b="${b%.html}" ;;
              *.md)   b="${b%.md}"   ;;
            esac
            if is_allowed "$b"; then continue; fi
            seen=0
            for u in $unexpected; do
              if [ "$u" = "$b" ]; then seen=1; break; fi
            done
            if [ "$seen" = "0" ]; then unexpected="$unexpected $b"; fi
          done

          if [ -n "$unexpected" ]; then
            echo "Unexpected root pages reached the site:$unexpected"
            echo "If one of these should be public, add it to the caller's allowed-pages."
            exit 1
          fi
          echo "Root pages are all declared."

      - name: Deploy to GitHub pages
        if: inputs.deploy && github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # `clean: true` makes the site equal what the build produced. `clean: false` never
          # deletes, so a page removed from the build would stay published.
          clean: true
          branch: gh-pages
          folder: docs
